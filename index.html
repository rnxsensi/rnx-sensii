<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RNX SENSI - Auto Headshot</title>
<style>
body{background:#0a0a0a;color:#fff;font-family:Arial;text-align:center;padding:15px}
.card{background:#1a1a1a;border:1px solid #ff3c00;border-radius:15px;padding:20px;max-width:400px;margin:auto}
.logo-img{width:130px;display:block;margin:0 auto 10px auto;filter:drop-shadow(0 0 10px #ff3c00)}
h1{color:#ff3c00;margin:5px 0} h1 span{color:#ffcc00}
select,input,button{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:none;font-size:16px}
select,input{background:#2a2a2a;color:#fff;border:1px solid #444}
button{background:linear-gradient(90deg,#ff3c00,#ff8c00);color:#fff;font-weight:bold;font-size:18px}
.res{margin-top:15px;background:#000;border-radius:10px;padding:15px;display:none;text-align:left}
.res p{margin:6px 0;border-bottom:1px solid #222;padding:5px 0}
.wa{background:#25D366 !important;margin-top:12px}
</style>
</head>
<body>
<div class="card">
<img src="logo.png" class="logo-img" onerror="this.style.display='none'">
<h1>RNX <span>SENSI</span></h1>
<p>Auto Headshot Sensitivity Generator</p>

<select id="brand"><option>Select Brand</option><option>Vivo</option><option>Realme</option><option>Poco</option><option>Samsung</option><option>Infinix</option><option>iPhone</option></select>
<select id="ram"><option>RAM</option><option>4GB</option><option>6GB</option><option>8GB</option><option>12GB</option></select>
<input id="model" placeholder="Model Ex: T4 5G">

<button onclick="generate()">GENERATE SENSI 🔥</button>

<div id="res" class="res">
<h3 style="color:#ffcc00;text-align:center">YOUR RNX SENSI</h3>
<p>General: <b id="g">186</b></p>
<p>Red Dot: <b id="r">192</b></p>
<p>2x Scope: <b id="2x">188</b></p>
<p>4x Scope: <b id="4x">184</b></p>
<p>Sniper: <b id="s">78</b></p>
<p>Free Look: <b id="f">81</b></p>
<p>Fire Button: <b>50%</b></p>
<button class="wa" onclick="shareWA()">📲 Share on WhatsApp</button>
</div>
</div>

<script>
function generate(){
let g=Math.floor(Math.random()*20)+175;
document.getElementById('g').innerText=g;
document.getElementById('r').innerText=g+6;
document.getElementById('2x').innerText=g+2;
document.getElementById('4x').innerText=g-2;
document.getElementById('s').innerText=Math.floor(Math.random()*20)+70;
document.getElementById('f').innerText=Math.floor(Math.random()*20)+70;
document.getElementById('res').style.display='block';
window.scrollTo(0,500);
}
function shareWA(){
let gen=document.getElementById('g').innerText;
let rd=document.getElementById('r').innerText;
let msg=`🔥 *MY RNX SENSI - Auto Headshot* 🔥%0A%0AGeneral: ${gen}%0ARed Dot: ${rd}%0A%0A👉 Generate Yours: https://rnxsensi.github.io/rnx-sensii/%0A%0A*Tested & Trusted*`;
window.open(`https://wa.me/?text=${msg}`,'_blank');
}
</script>
</body>
</html>
